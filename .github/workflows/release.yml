name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0)'
        required: true
        type: string
      build_linux:
        description: 'Linux (x86_64, .AppImage)'
        type: boolean
        default: true
      build_macos_x64:
        description: 'macOS Intel (x86_64, .dmg)'
        type: boolean
        default: true
      build_macos_arm64:
        description: 'macOS Apple Silicon (ARM64, .dmg)'
        type: boolean
        default: true
      build_windows:
        description: 'Windows (x86_64, .msi)'
        type: boolean
        default: true
      build_windows_portable:
        description: 'Windows (x86_64, portable .exe)'
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # ----------------------------------------------------------------
  # Resolve selected platforms into a JSON matrix that the build job
  # consumes via `fromJSON(needs.setup-matrix.outputs.matrix)`.
  # ----------------------------------------------------------------
  setup-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        shell: bash
        run: |
          PLATFORMS='[]'

          if [ "${{ github.event.inputs.build_linux }}" = "true" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq '. += [{
              "name": "linux",
              "os": "ubuntu-latest",
              "target": "x86_64-unknown-linux-gnu",
              "bundles": "appimage",
              "artifact_name": "deepseek-harness-x86_64.AppImage"
            }]')
          fi

          if [ "${{ github.event.inputs.build_macos_x64 }}" = "true" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq '. += [{
              "name": "macos-x86_64",
              "os": "macos-13",
              "target": "x86_64-apple-darwin",
              "bundles": "dmg",
              "artifact_name": "deepseek-harness-x86_64.dmg"
            }]')
          fi

          if [ "${{ github.event.inputs.build_macos_arm64 }}" = "true" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq '. += [{
              "name": "macos-arm64",
              "os": "macos-latest",
              "target": "aarch64-apple-darwin",
              "bundles": "dmg",
              "artifact_name": "deepseek-harness-aarch64.dmg"
            }]')
          fi

          if [ "${{ github.event.inputs.build_windows }}" = "true" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq '. += [{
              "name": "windows",
              "os": "windows-latest",
              "target": "x86_64-pc-windows-msvc",
              "bundles": "msi",
              "artifact_name": "deepseek-harness-x86_64.msi"
            }]')
          fi

          if [ "${{ github.event.inputs.build_windows_portable }}" = "true" ]; then
            PLATFORMS=$(echo "$PLATFORMS" | jq '. += [{
              "name": "windows-portable",
              "os": "windows-latest",
              "target": "x86_64-pc-windows-msvc",
              "bundles": "",
              "artifact_name": "deepseek-harness-x86_64-portable.exe"
            }]')
          fi

          echo "matrix={\"platform\":$(echo "$PLATFORMS" | jq -c '.')}" >> "$GITHUB_OUTPUT"

  # ----------------------------------------------------------------
  # Build each selected platform in parallel.
  # ----------------------------------------------------------------
  build:
    name: ${{ matrix.platform.name }}
    needs: [setup-matrix]
    if: needs.setup-matrix.outputs.matrix != '{"platform":[]}'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.platform.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.target }}

      - name: Install Linux system dependencies
        if: matrix.platform.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install npm dependencies
        run: npm ci

      - name: Set version from tag
        shell: bash
        run: |
          # Strip the leading "v" if present, e.g. "v0.3.0" -> "0.3.0"
          TAG="${{ github.event.inputs.tag }}"
          VERSION="${TAG#v}"

          echo "Applying version: $VERSION (from tag: $TAG)"

          # Update package.json
          npm pkg set version="$VERSION"
          echo "  package.json  -> $VERSION"

          # Update src-tauri/Cargo.toml (cross-platform: -i.bak works on both
          # GNU and BSD sed; remove the backup afterwards)
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" src-tauri/Cargo.toml
          rm -f src-tauri/Cargo.toml.bak
          echo "  Cargo.toml    -> $VERSION"

          # Update src-tauri/tauri.conf.json (top-level "version" only)
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json \
            && mv tmp.json src-tauri/tauri.conf.json
          echo "  tauri.conf.json -> $VERSION"

      # dist/index.html is a tiny placeholder committed to the repo as the
      # frontendDist that tauri build requires.  Double-check it exists
      # (if the file was somehow omitted from checkout, recreate it).
      - name: Ensure dist/index.html exists
        shell: bash
        run: |
          mkdir -p dist
          if [ ! -f dist/index.html ]; then
            cat > dist/index.html <<'EOF'
          <!doctype html>
          <html>
            <head><meta charset="utf-8" /><title>DeepSeek Harness</title></head>
            <body>Loading DeepSeek Harness…</body>
          </html>
          EOF
          fi

      - name: Build Tauri app
        shell: bash
        run: |
          if [ -n "${{ matrix.platform.bundles }}" ]; then
            npx tauri build --bundles ${{ matrix.platform.bundles }}
          else
            npx tauri build
          fi

      - name: Locate bundle artifact
        id: artifact
        shell: bash
        run: |
          if [ -n "${{ matrix.platform.bundles }}" ]; then
            BUNDLE_DIR="src-tauri/target/release/bundle/${{ matrix.platform.bundles }}"
            FILE=$(find "$BUNDLE_DIR" -maxdepth 1 -type f | head -1)
            if [ -z "$FILE" ]; then
              echo "No bundle artifact found in $BUNDLE_DIR"
              ls -la "$BUNDLE_DIR" || true
              exit 1
            fi
          else
            # Portable build: the raw exe is at target/release/<binary>.exe
            FILE="src-tauri/target/release/deepseek-harness.exe"
            if [ ! -f "$FILE" ]; then
              echo "Portable exe not found at $FILE"
              ls -la src-tauri/target/release/ || true
              exit 1
            fi
          fi
          echo "artifact_path=$FILE" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.artifact_name }}
          path: ${{ steps.artifact.outputs.artifact_path }}
          if-no-files-found: error

  # ----------------------------------------------------------------
  # Draft a GitHub Release with every artifact that was built.
  # ----------------------------------------------------------------
  create-release:
    name: Create Release
    needs: [build]
    if: ${{ !cancelled() && needs.build.result != 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all built artifacts
        uses: actions/download-artifact@v4

      - name: Upload artifacts to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          draft: true
          files: deepseek-harness-*/*