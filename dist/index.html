<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>DeepSeek Harness</title>
    <style>
      /* Color-matched to the dsh web client's framework-free boot page
         (dark-theme tokens: packages/client/web/src/boot-page.module.css). */
      html, body { margin: 0; height: 100%; background: #151517; }
      body {
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      }
      .card { display: flex; flex-direction: column; align-items: center; gap: 16px; }
      .wordmark { font-size: 16px; line-height: 24px; font-weight: 600; letter-spacing: 0.08em; color: #f9fafb; }
      .hint { font-size: 12px; line-height: 18px; color: #adb2b8; }
      .spinner {
        width: 20px; height: 20px; border-radius: 50%;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #f9fafb;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="spinner"></div>
      <div class="wordmark">DeepSeek Harness</div>
      <div class="hint">Starting the DeepSeek Harness server&hellip;</div>
    </div>
  </body>
</html>
